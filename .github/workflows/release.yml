name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Tests must pass before anything is published
        run: PYTHONPATH=src python -m unittest discover -s . -p 'test_*.py' -t .

      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib, sys
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"ok: releasing {version}")
          PY

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing via OIDC
    steps:
      - uses: actions/download-artifact@fa2a90109d7838618221049faede519d5c3f3050 # v4.1.8
        with:
          name: dist
          path: dist/

      # No API token is stored anywhere. Trusted Publishing exchanges a
      # short-lived OIDC identity for an upload credential, so there is no
      # long-lived secret in this repository to leak or rotate.
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa2a90109d7838618221049faede519d5c3f3050 # v4.1.8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@c9b46fe77461875c76a161ed6705d8f6d2f3479a # v2.1.0
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md

  # Floating major tag: after a successful build, move the v0 tag to
  # point at this release commit.
  update-floating-tag:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v0.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Force-update v0 tag to this commit
        run: |
          git tag -f v0
          git push origin v0 --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
