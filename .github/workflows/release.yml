name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name != 'v0'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Tests must pass before anything is published
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -t .

      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib, sys
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"ok: releasing {version}")
          PY

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing via OIDC
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md

  update-floating-tag:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v0.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Force-update v0 tag to this commit
        run: |
          git tag -f v0
          git push origin v0 --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
