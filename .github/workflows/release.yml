name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    outputs:
      build-attempt: ${{ steps.approval-candidate.outputs.build-attempt }}
    runs-on: ubuntu-latest
    if: github.ref_name != 'v0'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Tests must pass before anything is published
        # FAIL-CLOSED gate: any test failure aborts the release. Do NOT
        # reintroduce `|| true` here - it manufactured a green v0.4.0 release
        # whose own suite failed (version drift). If a test leg is fork-context
        # sensitive, fix the test, never the gate.
        run: |
          pip install -q '.[dev,melious]'
          # Use pytest instead of unittest to avoid fork context issues
          PYTHONPATH=src python -m pytest tests/ -q --timeout=30 --tb=short

      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib, sys
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"ok: releasing {version}")
          PY

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Rehearse the exact wheel in a clean environment
        run: python scripts/check_distributable.py --dist dist --out dist/candidate-manifest.json

      - name: Bind exact release bytes and requested effects (not an approval)
        id: approval-candidate
        env:
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/check_release_approval.py --dist dist --create --build-attempt "$BUILD_ATTEMPT"
          echo "build-attempt=$BUILD_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dist
          path: dist/

  publish:
    outputs:
      build-attempt: ${{ needs.build.outputs.build-attempt }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hosted prerequisites: independent reviewers, prevent self-review/bypass,
    # environment-only digest variable, and no org/repo same-name collision.
    environment: pypi
    # Dry-run safety: a workflow_dispatch run builds and tests but must never
    # upload, even when dispatched against a tag. Only a tag PUSH publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write        # PyPI Trusted Publishing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Require externally approved exact bytes before PyPI publication
        env:
          JITTEST_RELEASE_APPROVAL_SHA256: ${{ vars.JITTEST_RELEASE_APPROVAL_SHA256 }}
          BUILD_ATTEMPT: ${{ needs.build.outputs.build-attempt }}
        run: python scripts/check_release_approval.py --dist dist --effect pypi --build-attempt "$BUILD_ATTEMPT"

      - name: Publish distributions only, not the rehearsal manifest
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist/

  verify-published:
    environment: pypi
    outputs:
      build-attempt: ${{ needs.publish.outputs.build-attempt }}
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Recheck downloaded bytes and external approval before registry check
        env:
          JITTEST_RELEASE_APPROVAL_SHA256: ${{ vars.JITTEST_RELEASE_APPROVAL_SHA256 }}
          BUILD_ATTEMPT: ${{ needs.publish.outputs.build-attempt }}
        run: python scripts/check_release_approval.py --dist dist --effect pypi --build-attempt "$BUILD_ATTEMPT"
      - name: Match public registry bytes to the approved build
        run: python scripts/check_published_bytes.py --dist dist

  github-release:
    environment: pypi
    needs: verify-published
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require externally approved exact bytes before GitHub release
        env:
          JITTEST_RELEASE_APPROVAL_SHA256: ${{ vars.JITTEST_RELEASE_APPROVAL_SHA256 }}
          BUILD_ATTEMPT: ${{ needs.verify-published.outputs.build-attempt }}
        run: python scripts/check_release_approval.py --dist dist --effect github_release --build-attempt "$BUILD_ATTEMPT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          body_path: CHANGELOG.md

  update-floating-tag:
    environment: pypi
    needs: [verify-published, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Refuse prerelease advancement of stable v0
        id: release-channel
        run: python scripts/check_floating_tag.py "$GITHUB_REF"

      - name: Require externally approved exact bytes before floating tag update
        if: steps.release-channel.outputs.stable == 'true'
        env:
          JITTEST_RELEASE_APPROVAL_SHA256: ${{ vars.JITTEST_RELEASE_APPROVAL_SHA256 }}
          BUILD_ATTEMPT: ${{ needs.verify-published.outputs.build-attempt }}
        run: python scripts/check_release_approval.py --dist dist --effect floating_v0 --build-attempt "$BUILD_ATTEMPT"

      - name: Force-update v0 tag to this commit
        if: steps.release-channel.outputs.stable == 'true'
        run: |
          git tag -f v0
          git push origin v0 --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
