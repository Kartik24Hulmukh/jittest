name: ga73-isolated-smoke
on:
  push:
    branches: [harden/jittest-v1-launch]
    paths:
      - 'src/jittest/**'
      - 'eval/ga73_smoke.py'
      - 'eval/preflight_model.py'
      - 'docker/ga73-smoke/**'
      - '.github/workflows/ga73-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ga73-isolated-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install trusted Jittest and test the acceptance contract
        run: |
          python -m pip install -e '.[dev,melious]'
          python -m pytest tests/test_ga73_smoke_acceptance.py tests/test_isolated_pytest_runner.py tests/test_production_transport.py
      - name: Resolve official Python digest and build trusted evaluation image
        run: |
          set -euo pipefail
          docker pull python:3.8-slim
          BASE=$(docker image inspect -f '{{index .RepoDigests 0}}' python:3.8-slim)
          echo "$BASE" > ga73-base-image.txt
          docker build --build-arg PYTHON_BASE="$BASE" -t localhost:5000/jittest-ga73:smoke docker/ga73-smoke
          docker run -d --name ga73-registry -p 127.0.0.1:5000:5000 registry:2
          docker push localhost:5000/jittest-ga73:smoke
          PIN=$(docker image inspect -f '{{index .RepoDigests 0}}' localhost:5000/jittest-ga73:smoke)
          docker pull "$PIN"
          echo "$PIN" > ga73-runtime-image.txt
          echo "JITTEST_RUNTIME_IMAGE=$PIN" >> "$GITHUB_ENV"
      - name: Clone pinned corpus as inert data only
        run: |
          git clone https://github.com/soarsmu/BugsInPy /tmp/BugsInPy
          git -C /tmp/BugsInPy checkout 11c5f1eea954a42132cfd06bf257766a7963e0fd
      - name: Verify official dated FX rate
        run: |
          curl --fail --silent --show-error https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml -o ga73-fx.xml
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          root=ET.parse('ga73-fx.xml').getroot()
          rate=next(n.attrib['rate'] for n in root.iter() if n.attrib.get('currency')=='USD')
          date=next(n.attrib['time'] for n in root.iter() if 'time' in n.attrib)
          print('Official FX date:', date)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('JITTEST_EUR_USD='+rate+'\n')
          PY
      - name: Real daemon isolation canaries
        env:
          JITTEST_SANDBOX: required
          JITTEST_SANDBOX_BACKEND: docker
        run: |
          docker pull python:3.13-slim
          python scripts/isolation_canaries.py
      - name: Bounded paid real-corpus smoke
        env:
          JITTEST_API_KEY: ${{ secrets.JITTEST_MELIOUS_API_KEY }}
          JITTEST_MODEL: melious/glm-5.3-flash
          JITTEST_API_BASE: https://api.melious.ai/v1
          JITTEST_SANDBOX: required
          JITTEST_SANDBOX_BACKEND: docker
          JITTEST_MAX_RETRIES: '2'
          JITTEST_RETRY_MAX_SLEEP: '1'
          JITTEST_HTTP_TIMEOUT: '30'
          PYTHONHASHSEED: '0'
        run: python eval/ga73_smoke.py --bugsinpy /tmp/BugsInPy --out ga73-smoke.json
      - name: Predeclared downstream real-bug and settled-merge pilot
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ga73-measure]')
        env:
          JITTEST_API_KEY: ${{ secrets.JITTEST_MELIOUS_API_KEY }}
          JITTEST_MODEL: melious/glm-5.3-flash
          JITTEST_API_BASE: https://api.melious.ai/v1
          JITTEST_SANDBOX: required
          JITTEST_SANDBOX_BACKEND: docker
          JITTEST_MAX_RETRIES: '1'
          JITTEST_RETRY_MAX_SLEEP: '1'
          JITTEST_HTTP_TIMEOUT: '30'
          PYTHONHASHSEED: '0'
        run: python eval/ga73_measurements.py --bugsinpy /tmp/BugsInPy --smoke ga73-smoke.json --out ga73-measurements.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ga73-smoke-${{ github.sha }}
          path: |
            ga73-smoke.json
            ga73-measurements.json
            ga73-base-image.txt
            ga73-runtime-image.txt
            ga73-fx.xml
          if-no-files-found: error
