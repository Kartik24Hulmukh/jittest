name: diagnose-pr-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-new-test:
    name: ruff-new-test-${{ matrix.rule }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rule: [E, F, I, UP, B, SIM]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --select ${{ matrix.rule }} tests/test_action_artifact_contract.py

  ruff-existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests --exclude test_action_artifact_contract.py

  absolute-path-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shipped-file path scan
        run: |
          python - <<'PY'
          import subprocess
          import sys
          targets = ['src', 'scripts', 'tests', 'action.yml', 'pyproject.toml', 'README.md']
          files = []
          tracked = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True)
          for path in tracked.stdout.splitlines():
              if any(path == target or path.startswith(target + '/') for target in targets):
                  files.append(path)
          forbidden = ['c:\\users', 'c:/users', '/home/user']
          violations = []
          for path in files:
              with open(path, encoding='utf-8', errors='ignore') as handle:
                  for number, line in enumerate(handle, 1):
                      if any(pattern in line.lower() for pattern in forbidden):
                          violations.append(f'{path}:{number}')
          print(violations)
          sys.exit(bool(violations))
          PY

  receipt-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify committed receipts
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          from pathlib import Path
          from jittest.receipt import verify_receipt
          bad = []
          for path in Path('receipts').rglob('*'):
              if path.is_file():
                  valid, reason = verify_receipt(path)
                  if not valid:
                      bad.append((str(path), reason))
          print(bad)
          sys.exit(bool(bad))
          PY
