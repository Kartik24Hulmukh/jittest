name: install-smoke

on:
  push:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - run: pip install .

      - run: cd /tmp && jittest version

      - run: cd $GITHUB_WORKSPACE && jittest doctor

      - run: cd $GITHUB_WORKSPACE && jittest run --base HEAD~1 --head HEAD --dry-run
