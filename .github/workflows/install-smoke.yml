name: install-smoke

on:
  push:
  workflow_dispatch:

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install .

      - run: cd /tmp && jittest version

      - run: cd $GITHUB_WORKSPACE && jittest doctor

      - run: cd $GITHUB_WORKSPACE && jittest run --base HEAD~1 --head HEAD --dry-run
