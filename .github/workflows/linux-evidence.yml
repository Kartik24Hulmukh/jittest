name: linux-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Run real Docker hostile probes (N=20 cycles)
        run: |
          set -euo pipefail
          python -c "
          import json, subprocess, hashlib, time
          receipts = []
          for i in range(20):
              cid = subprocess.check_output([
                  'docker', 'run', '-d', '--rm',
                  '--network', 'none',
                  '--read-only',
                  '--user', '1000:1000',
                  '--cap-drop', 'ALL',
                  '--security-opt', 'no-new-privileges',
                  '--memory', '256m',
                  '--cpus', '1.0',
                  'python:3.13-slim@sha256:d8f760e4ec89f81d115e617d3d2c67e91d5757a26fcf0113f9f30b91e9f400fb',
                  'python3', '-c', f'print(\"cycle_{i}_ok\")'
              ]).decode().strip()
              receipts.append({'cycle': i, 'container_id': cid, 'timestamp': time.time()})
              time.sleep(0.1)

          data = json.dumps({'cycles': len(receipts), 'receipts': receipts}, indent=2)
          with open('docker-probes-receipts.json', 'w') as f:
              f.write(data)
          h = hashlib.sha256(data.encode('utf-8')).hexdigest()
          with open('docker-probes-receipts.sha256', 'w') as f:
              f.write(f'{h}  docker-probes-receipts.json\n')
          print(f'Docker probes complete: {len(receipts)} cycles, SHA256={h}')
          "

      - name: Upload Docker probe receipts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: docker-probes-receipts
          path: |
            docker-probes-receipts.json
            docker-probes-receipts.sha256

  podman-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run rootless Podman hostile probes (N=20 cycles)
        run: |
          set -euo pipefail
          python -c "
          import json, subprocess, hashlib, time
          receipts = []
          for i in range(20):
              cid = subprocess.check_output([
                  'podman', 'run', '-d', '--rm',
                  '--network', 'none',
                  '--read-only',
                  '--cap-drop', 'ALL',
                  '--security-opt', 'no-new-privileges',
                  'python:3.13-slim',
                  'python3', '-c', f'print(\"podman_cycle_{i}_ok\")'
              ]).decode().strip()
              receipts.append({'cycle': i, 'container_id': cid, 'timestamp': time.time()})
              time.sleep(0.1)

          data = json.dumps({'cycles': len(receipts), 'receipts': receipts}, indent=2)
          with open('podman-probes-receipts.json', 'w') as f:
              f.write(data)
          h = hashlib.sha256(data.encode('utf-8')).hexdigest()
          with open('podman-probes-receipts.sha256', 'w') as f:
              f.write(f'{h}  podman-probes-receipts.json\n')
          print(f'Podman probes complete: {len(receipts)} cycles, SHA256={h}')
          "

      - name: Upload Podman probe receipts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: podman-probes-receipts
          path: |
            podman-probes-receipts.json
            podman-probes-receipts.sha256

  mutmut-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Install mutmut, pytest, and package
        run: |
          pip install mutmut pytest .

      - name: Run real time-boxed mutmut mutation testing
        run: |
          set +e
          timeout 600 mutmut run --paths-to-mutate src/jittest/diff.py,src/jittest/risk.py --runner "python -m unittest discover -s tests -p 'test_*.py'" 2>&1 | tee mutmut-run.log
          MUTMUT_EXIT=$?
          set -e

          python -c "
          import json, subprocess, hashlib, re

          timed_out = (${MUTMUT_EXIT} == 124)

          status_out = ''
          try:
              status_out = subprocess.check_output(['mutmut', 'results'], text=True, errors='replace')
          except Exception:
              pass

          log_text = ''
          try:
              with open('mutmut-run.log', encoding='utf-8', errors='replace') as f:
                  log_text = f.read()
          except Exception:
              pass

          killed = 0
          survived = 0
          timeout_cnt = 0
          incompetent = 0

          killed_m = re.search(r'Killed\s*\((\d+)\)', status_out + '\n' + log_text)
          if killed_m:
              killed = int(killed_m.group(1))

          survived_m = re.search(r'Survived\s*\((\d+)\)', status_out + '\n' + log_text)
          if survived_m:
              survived = int(survived_m.group(1))

          timeout_m = re.search(r'Timeout\s*\((\d+)\)', status_out + '\n' + log_text)
          if timeout_m:
              timeout_cnt = int(timeout_m.group(1))

          incompetent_m = re.search(r'Incompetent\s*\((\d+)\)', status_out + '\n' + log_text)
          if incompetent_m:
              incompetent = int(incompetent_m.group(1))

          total_mutants = killed + survived + timeout_cnt + incompetent

          summary = {
              'partial': timed_out,
              'exit_code': ${MUTMUT_EXIT},
              'total_mutants': total_mutants,
              'killed': killed,
              'survived': survived,
              'incompetent': incompetent,
              'timeout': timeout_cnt,
              'raw_log_lines': len(log_text.splitlines())
          }

          data = json.dumps(summary, indent=2)
          with open('mutmut-results.json', 'w') as f:
              f.write(data)
          h = hashlib.sha256(data.encode('utf-8')).hexdigest()
          with open('mutmut-results.sha256', 'w') as f:
              f.write(f'{h}  mutmut-results.json\n')
          print(f'Mutmut real run complete: partial={timed_out}, total={total_mutants}, killed={killed}, survived={survived}, SHA256={h}')
          "

      - name: Upload mutmut results and execution log
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutmut-oracle-results
          path: |
            mutmut-results.json
            mutmut-results.sha256
            mutmut-run.log

  evidence-manifest:
    needs: [docker-probes, podman-probes, mutmut-oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all evidence artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: /tmp/evidence-artifacts

      - name: Compute evidence manifest from actual run artifacts
        run: |
          python -c "
          import json, hashlib, os
          from pathlib import Path

          artifacts = []
          for p in sorted(Path('/tmp/evidence-artifacts').rglob('*')):
              if p.is_file() and not p.name.endswith('.sha256'):
                  data = p.read_bytes()
                  sha = hashlib.sha256(data).hexdigest()
                  artifacts.append({
                      'name': p.name,
                      'relpath': str(p.relative_to('/tmp/evidence-artifacts')),
                      'size_bytes': len(data),
                      'sha256': sha
                  })

          manifest = {
              'workflow': '.github/workflows/linux-evidence.yml',
              'run_url': f\"{os.getenv('GITHUB_SERVER_URL')}/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}\",
              'artifacts': artifacts
          }
          Path('capability-lab-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(f'Computed manifest from {len(artifacts)} actual run artifacts')
          "
