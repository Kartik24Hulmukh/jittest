name: jittest verify PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run jittest verify action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sandbox-mode: 'auto'
