name: security-arms

# Security posture validation arms: forged receipt rejection and sandbox enforcement.
# These arms are NOT part of the WO-17 pre-registration and must NOT be labelled WO-17.
# They probe the security boundaries of jittest (receipt forgery and sandbox bypass).

on:
  workflow_dispatch:

concurrency:
  group: security-arms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-arm-forged:
    name: ${{ matrix.instance_id }} (forged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - pallets__flask-4045
          - psf__requests-1963
          - pytest-dev__pytest-5103

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security arm (forged)
        run: |
          python scripts/run_security_arm.py \
            --manifest eval/swebench_lite_20.json \
            --instance-id "${{ matrix.instance_id }}" \
            --arm forged \
            --output-dir security_arm_artifacts

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-forged-${{ matrix.instance_id }}
          path: security_arm_artifacts/

  security-arm-unsandboxed:
    name: ${{ matrix.instance_id }} (unsandboxed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - pallets__flask-4045
          - psf__requests-1963
          - pytest-dev__pytest-5103

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security arm (unsandboxed)
        run: |
          python scripts/run_security_arm.py \
            --manifest eval/swebench_lite_20.json \
            --instance-id "${{ matrix.instance_id }}" \
            --arm unsandboxed \
            --output-dir security_arm_artifacts

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-unsandboxed-${{ matrix.instance_id }}
          path: security_arm_artifacts/
