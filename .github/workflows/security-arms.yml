name: security-arms

# Security posture validation arms: forged receipt rejection and sandbox enforcement.
# These arms are NOT part of the WO-17 pre-registration and must NOT be labelled WO-17.
# They probe the security boundaries of jittest (receipt forgery and sandbox bypass).

on:
  workflow_dispatch:

concurrency:
  group: security-arms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-arm-forged:
    name: ${{ matrix.instance_id }} (forged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - pallets__flask-4045
          - psf__requests-1963
          - pytest-dev__pytest-5103

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security arm (forged)
        run: |
          python scripts/run_security_arm.py \
            --manifest eval/swebench_lite_20.json \
            --instance-id "${{ matrix.instance_id }}" \
            --arm forged \
            --output-dir security_arm_artifacts

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: security-forged-${{ matrix.instance_id }}
          path: security_arm_artifacts/

  security-arm-unsandboxed:
    name: ${{ matrix.instance_id }} (unsandboxed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - pallets__flask-4045
          - psf__requests-1963
          - pytest-dev__pytest-5103

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security arm (unsandboxed)
        run: |
          python scripts/run_security_arm.py \
            --manifest eval/swebench_lite_20.json \
            --instance-id "${{ matrix.instance_id }}" \
            --arm unsandboxed \
            --output-dir security_arm_artifacts

      - name: Upload arm evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: security-unsandboxed-${{ matrix.instance_id }}
          path: security_arm_artifacts/
