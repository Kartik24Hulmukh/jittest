# Drop-in workflow for the current differential receipt-verification Action.
# Generation/evaluation is separate and optional; this workflow needs no model key.
name: jittest
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: jittest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catching-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Local action tests this PR's implementation. Consumers should pin an
      # approved released Action revision instead, with the same supported inputs.
      - name: Verify differential test receipts in required isolation
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo-path: '.'
          pr-number: ${{ github.event.pull_request.number }}
          sandbox-mode: 'required'
          policy: 'advisory'
          budget: '1.00'
          output-dir: 'jittest-telemetry'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jittest-telemetry
          path: jittest-telemetry/
          retention-days: 30
