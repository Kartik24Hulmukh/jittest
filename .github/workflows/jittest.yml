# Drop-in workflow for a project that wants catching tests on every PR.
# Copy this into .github/workflows/ of the target repository.
name: jittest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catching-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip drafts and dependency bumps: cost discipline is a feature.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # required: we check out both base and head

      # Determine whether we have an API key. When absent, run in dry-run
      # mode so the workflow exercises the full pipeline without cost.
      # This is NOT continue-on-error: the step explicitly branches.
      - name: Check for API key
        id: key-check
        run: |
          if [ -z "${{ secrets.JITTEST_API_KEY }}" ]; then
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JITTEST_API_KEY secret found — running in dry-run mode."
          else
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          fi

      # Use the local action (./) so each PR is tested by the code in that PR.
      # External users should reference Kartik24Hulmukh/jittest@v0.3.2 or @v0 instead.
      # Model and API base come from repository variables (non-secret).
      # API key comes from repository secrets.
      - uses: ./
        with:
          model: ${{ vars.JITTEST_MODEL }}
          api-base: ${{ vars.JITTEST_API_BASE }}
          api-key: ${{ secrets.JITTEST_API_KEY }}
          budget: "1.00"
          max-targets: "5"
          dry-run: ${{ steps.key-check.outputs.has-key == 'false' }}
          fail-on-regression: "false"   # advisory first. Earn the gate.

      # Upload telemetry and anonymised ledger export as a workflow artifact.
      # The raw ledger database is never uploaded.
      - name: Export ledger and upload telemetry
        if: always()
        run: |
          mkdir -p jittest-telemetry
          # Export anonymised ledger (no repo names, no PR IDs, no source code)
          jittest export jittest-telemetry/ledger.jsonl || true
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: jittest-telemetry
          path: jittest-telemetry/
          retention-days: 30
