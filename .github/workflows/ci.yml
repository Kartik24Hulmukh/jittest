name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Test with no dependencies at all
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -t . -v
        shell: bash

      - name: Test again with pytest present
        run: |
          pip install pytest pytest-timeout
          pytest -q
        shell: bash

      - name: Verify the package still declares no dependencies
        run: |
          python - <<'PY'
          import tomllib, sys
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          if deps:
              sys.exit(f"jittest must stay dependency-free, found: {deps}")
          print("ok: zero dependencies")
          PY
        shell: bash

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src/jittest --ignore-missing-imports || true
      - name: Assert no absolute local user paths in tracked files
        run: |
          python - <<'PY'
          import subprocess, sys
          res = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True)
          files = [f.strip() for f in res.stdout.splitlines() if f.strip()]
          forbidden = ['c:\\users', 'c:/users', '/home/runner/', '/home/user']
          violations = []
          for f in files:
              if f == '.github/workflows/ci.yml':
                  continue
              try:
                  with open(f, 'r', encoding='utf-8', errors='ignore') as fh:
                      for i, line in enumerate(fh, 1):
                          line_l = line.lower()
                          for pat in forbidden:
                              if pat in line_l:
                                  violations.append(f"{f}:{i}: {line.strip()}")
              except Exception:
                  pass
          if violations:
              print(f"Found {len(violations)} absolute local path violations:")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          print("ok: zero absolute local paths found")
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist
          path: dist/

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run jittest on jittest
        run: |
          jittest doctor
          jittest run \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --dry-run --json

  consumer_action_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Create external consumer fixture repo with both regression and reproduction cases
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/consumer-repo"
          cd "${RUNNER_TEMP}/consumer-repo"
          git init
          git config user.name "consumer"
          git config user.email "consumer@example.com"
          
          # Base commit: valid calculator, buggy multiplier
          cat << 'EOF' > calc.py
          def add(a, b): return a + b
          def mul(a, b): return a + b  # bug on base
          EOF
          mkdir -p tests
          cat << 'EOF' > tests/test_calc.py
          from calc import add
          def test_add():
              assert add(2, 3) == 5
          EOF
          git add .
          git commit -m "base: valid add, buggy mul"
          BASE_SHA=$(git rev-parse HEAD)

          # Head commit: regression in add, fixed mul + new test for mul
          cat << 'EOF' > calc.py
          def add(a, b): return a - b  # regression on head
          def mul(a, b): return a * b  # fixed mul on head
          EOF
          cat << 'EOF' > tests/test_calc.py
          from calc import add
          def test_add():
              # Modified regression test
              assert add(2, 3) == 5
          EOF
          cat << 'EOF' > tests/test_mul.py
          from calc import mul
          def test_mul():
              # New reproduction test
              assert mul(2, 3) == 6
          EOF
          git add calc.py tests/test_calc.py tests/test_mul.py
          git commit -m "head: regression in add, fixed mul + new test"
          HEAD_SHA=$(git rev-parse HEAD)

          echo "JITTEST_BASE=$BASE_SHA" >> $GITHUB_ENV
          echo "JITTEST_HEAD=$HEAD_SHA" >> $GITHUB_ENV

      - name: Run composite action against consumer repo in strict policy mode
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/consumer-repo
          sandbox-mode: 'off'
          policy: 'strict'
          output-dir: ${{ runner.temp }}/consumer-evidence

      - name: Assert consumer action results and evidence contract
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, sys, os
          evidence_dir = os.environ.get("RUNNER_TEMP", "/tmp") + "/consumer-evidence"
          files = glob.glob(evidence_dir + "/*.json")
          if not files:
              sys.exit(f"FAIL: No evidence JSON generated in {evidence_dir}")

          disallowed_dispositions = {
              "base_uncollectable",
              "head_uncollectable",
              "ENV_SETUP_FAILED",
              "SANDBOX_UNAVAILABLE",
              "TIMEOUT",
              "file_not_found",
              "base_reproduction_failed",
              "head_failed_base_failed_latent",
          }

          regression_catches = 0
          reproduction_catches = 0
          for f in files:
              data = json.load(open(f, encoding="utf-8"))
              verdict = data.get("verdict")
              disposition = data.get("disposition")
              proven = data.get("proven_catch")
              print(f"Evidence file {f}: verdict={verdict}, disposition={disposition}, proven_catch={proven}")

              if disposition in disallowed_dispositions:
                  sys.exit(f"FAIL: Disallowed disposition found: {disposition}")

              if verdict == "proven_catch":
                  regression_catches += 1
              elif verdict == "reproduction_catch":
                  reproduction_catches += 1

          print(f"Regression catches: {regression_catches}, Reproduction catches: {reproduction_catches}")
          if regression_catches == 0:
              sys.exit("FAIL: Zero regression catches found in consumer action run!")
          if reproduction_catches == 0:
              sys.exit("FAIL: Zero reproduction catches found in consumer action run!")

          print("SUCCESS: consumer-action-e2e verified both regression and reproduction catches.")
          PY

  ci:
    if: always()
    needs: [lint, test, build, consumer_action_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate result
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} consumer=${{ needs.consumer_action_e2e.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.consumer_action_e2e.result }}" = "success" ] || exit 1

