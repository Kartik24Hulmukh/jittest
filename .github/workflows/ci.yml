name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git for the fixture repositories
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Test with no dependencies at all
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -t . -v
        shell: bash

      - name: Test again with pytest present
        run: |
          pip install pytest pytest-timeout
          pytest -q
        shell: bash

      - name: Verify the package still declares no dependencies
        run: |
          python - <<'PY'
          import tomllib, sys
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          if deps:
              sys.exit(f"jittest must stay dependency-free, found: {deps}")
          print("ok: zero dependencies")
          PY
        shell: bash

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src/jittest --ignore-missing-imports || true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run jittest on jittest
        run: |
          jittest doctor
          jittest run \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --dry-run --json

  consumer-action-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config --global user.email "ci@jittest.dev"
          git config --global user.name "jittest ci"
          git config --global init.defaultBranch main

      - name: Create external consumer fixture repo
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/consumer-repo"
          cd "${RUNNER_TEMP}/consumer-repo"
          git init
          git config user.name "consumer"
          git config user.email "consumer@example.com"
          echo "def add(a, b): return a + b" > calc.py
          mkdir -p tests
          echo "def test_calc(): assert True" > tests/test_calc.py
          git add .
          git commit -m "base commit"
          BASE_SHA=$(git rev-parse HEAD)

          echo "def test_calc(): assert 1 + 1 == 2" > tests/test_calc.py
          git add tests/test_calc.py
          git commit -m "head commit"
          HEAD_SHA=$(git rev-parse HEAD)

          echo "JITTEST_BASE=$BASE_SHA" >> $GITHUB_ENV
          echo "JITTEST_HEAD=$HEAD_SHA" >> $GITHUB_ENV

      - name: Run composite action against consumer repo
        uses: ./
        with:
          repo-path: ${{ runner.temp }}/consumer-repo
          sandbox-mode: 'off'
          policy: 'advisory'

  ci:
    if: always()
    needs: [lint, test, build, consumer-action-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check aggregate result
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} consumer=${{ needs.consumer-action-e2e.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.consumer-action-e2e.result }}" = "success" ] || exit 1

