version: 2
updates:
  # jittest has zero runtime dependencies, so this only watches the dev and
  # optional extras. If dependabot ever opens a PR against `dependencies`,
  # something has gone wrong and the CI guard job will fail.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
