name: 'jittest verify'
description: 'Verify new or modified tests across paired PR base and head commits with Ed25519 signed receipts.'
author: 'jittest'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  repo-path:
    description: 'Path to git repository'
    required: false
    default: '.'
  pr-number:
    description: 'PR number to verify'
    required: false
    default: ''
  sandbox-mode:
    description: 'Sandbox isolation mode: auto, required, or off (leave empty for automatic fork isolation)'
    required: false
    default: ''
  policy:
    description: 'Exit policy: advisory (default), strict, or block-on-refusal'
    required: false
    default: 'advisory'
  budget:
    description: 'Per-PR cost ceiling in USD'
    required: false
    default: '1.00'
  output-dir:
    description: 'Output directory for evidence JSON artifacts'
    required: false
    default: 'jittest-evidence'
  github-token:
    description: 'GitHub token for PR comment upserting'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'

    - name: Install jittest in isolated venv
      shell: bash
      run: |
        python -m venv "${RUNNER_TEMP}/jittest-action-venv"
        if [ -f "${RUNNER_TEMP}/jittest-action-venv/bin/python" ]; then
          PY_BIN="${RUNNER_TEMP}/jittest-action-venv/bin/python"
          PIP_BIN="${RUNNER_TEMP}/jittest-action-venv/bin/pip"
        else
          PY_BIN="${RUNNER_TEMP}/jittest-action-venv/Scripts/python.exe"
          PIP_BIN="${RUNNER_TEMP}/jittest-action-venv/Scripts/pip.exe"
        fi
        "$PIP_BIN" install --upgrade pip
        "$PIP_BIN" install "${{ github.action_path }}"

    - name: Run jittest verify action
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        JITTEST_REPO_PATH: ${{ inputs.repo-path }}
        JITTEST_PR_NUMBER: ${{ inputs.pr-number }}
        JITTEST_SANDBOX_MODE: ${{ inputs.sandbox-mode }}
        JITTEST_POLICY: ${{ inputs.policy }}
        JITTEST_BUDGET: ${{ inputs.budget }}
        JITTEST_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        if [ -f "${RUNNER_TEMP}/jittest-action-venv/bin/python" ]; then
          "${RUNNER_TEMP}/jittest-action-venv/bin/python" -m jittest.action
        else
          "${RUNNER_TEMP}/jittest-action-venv/Scripts/python.exe" -m jittest.action
        fi

    - name: Upload evidence artifacts
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: jittest-evidence
        path: jittest-evidence/
        retention-days: 30
        if-no-files-found: ignore
