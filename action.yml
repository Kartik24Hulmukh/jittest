name: 'jittest verify'
description: 'Verify new or modified tests across paired PR base and head commits with Ed25519 signed receipts.'
author: 'jittest'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  repo-path:
    description: 'Path to git repository'
    required: false
    default: '.'
  pr-number:
    description: 'PR number to verify'
    required: false
    default: ''
  sandbox-mode:
    description: 'Sandbox isolation mode: auto, required, or off'
    required: false
    default: 'auto'
  budget:
    description: 'Per-PR cost ceiling in USD'
    required: false
    default: '1.00'
  github-token:
    description: 'GitHub token for PR comment upserting'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pytest
        pip install -e ${{ inputs.repo-path }}

    - name: Run jittest verify action
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        JITTEST_REPO_PATH: ${{ inputs.repo-path }}
        JITTEST_PR_NUMBER: ${{ inputs.pr-number }}
        JITTEST_SANDBOX_MODE: ${{ inputs.sandbox-mode }}
        JITTEST_BUDGET: ${{ inputs.budget }}
      run: |
        python -m jittest.action

    - name: Upload evidence artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jittest-evidence
        path: jittest-evidence/
        retention-days: 30
        if-no-files-found: ignore
